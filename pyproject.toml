[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-targeting"
version = "0.1.0"
description = "Python package for private targeting estimators DP-CATE and DP-policy"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "UNLICENSED"}
authors = [
    {name = "Gilian Ponte"}
]
keywords = ["differential privacy", "causal inference", "treatment effects", "targeting", "marketing"]
dependencies = [
    "numpy>=1.23.5,<2.0.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
ml = [
    "tensorflow==2.15.1",
]
tuning = [
    "keras-tuner>=1.4,<2.0",
    "tensorboard>=2.15,<2.16",
]
privacy = [
    "tensorflow==2.15.1",
    "keras==2.15.0",
    "tensorboard>=2.15,<2.16",
    "tensorflow-estimator>=2.15,<2.16",
    "tensorflow-probability>=0.22,<0.23",
    "tensorflow-privacy==0.9.0",
]
full = [
    "tensorflow==2.15.1",
    "keras==2.15.0",
    "keras-tuner>=1.4,<2.0",
    "tensorboard>=2.15,<2.16",
    "tensorflow-estimator>=2.15,<2.16",
    "tensorflow-probability>=0.22,<0.23",
    "tensorflow-privacy==0.9.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/GilianPonte/private-targeting"
Repository = "https://github.com/GilianPonte/private-targeting"
Issues = "https://github.com/GilianPonte/private-targeting/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
